<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>校园资料智能整理助手 · 静态预览（Mock）</title>
  <script>
    /* CDN 加载失败兜底：任一依赖脚本失败或页面未渲染完成时显示静态提示，避免整页空白 */
    window.__previewFallback = function (reason) {
      var box = document.getElementById("cdn-fallback");
      if (!box) return;
      box.style.display = "block";
      var detail = document.getElementById("cdn-fallback-reason");
      if (detail && reason) detail.textContent = "原因：" + reason;
    };
    window.__previewReady = function () {
      window.__previewMounted = true;
      var box = document.getElementById("cdn-fallback");
      if (box) box.style.display = "none";
    };
  </script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" onerror="window.__previewFallback && window.__previewFallback('React 加载失败（CDN 不可达）')"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" onerror="window.__previewFallback && window.__previewFallback('ReactDOM 加载失败（CDN 不可达）')"></script>
  <script src="https://unpkg.com/dayjs@1.11.23/dayjs.min.js" onerror="window.__previewFallback && window.__previewFallback('dayjs 加载失败（CDN 不可达）')"></script>
  <script src="https://unpkg.com/antd@5.29.3/dist/antd.min.js" onerror="window.__previewFallback && window.__previewFallback('Ant Design 加载失败（CDN 不可达）')"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" onerror="window.__previewFallback && window.__previewFallback('ECharts 加载失败（CDN 不可达）')"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.14/babel.min.js" onerror="window.__previewFallback && window.__previewFallback('Babel 加载失败（CDN 不可达）')"></script>
  <script src="mock/data.js"></script>
  <script src="api/client.js"></script>
  <script>
    /* 全局兜底检查：任一依赖缺失、脚本报错或 8 秒内未渲染完成，都给出可见提示 */
    (function () {
      var deps = [
        ["React", window.React],
        ["ReactDOM", window.ReactDOM],
        ["Ant Design", window.antd],
        ["ECharts", window.echarts],
        ["Babel", window.Babel]
      ];
      var missing = [];
      for (var i = 0; i < deps.length; i++) {
        if (!deps[i][1]) missing.push(deps[i][0]);
      }
      if (missing.length) {
        window.__previewFallback("缺少依赖：" + missing.join("、"));
        return;
      }
      window.onerror = function (message) {
        window.__previewFallback("页面脚本执行异常：" + message);
      };
      window.setTimeout(function () {
        if (!window.__previewMounted) {
          window.__previewFallback("资源加载超时或页面渲染未完成");
        }
      }, 8000);
    })();
  </script>
  <style>
    body { margin: 0; background: #f5f7fa; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    #cdn-fallback { display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 9999; background: #f5f7fa; padding: 56px 24px; text-align: center; }
    #cdn-fallback h2 { margin: 0 0 12px; font-size: 20px; color: #1f2d3d; }
    #cdn-fallback p { margin: 6px 0; color: #5b6474; font-size: 14px; line-height: 1.8; }
    #cdn-fallback code { background: #fff; border: 1px solid #e3e8ef; border-radius: 4px; padding: 1px 6px; color: #1f2d3d; }
    #cdn-fallback .reason { color: #cf1322; margin-top: 14px; }
    .app-header { background: #fff; border-bottom: 1px solid #eef0f4; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
    .app-title { font-size: 17px; font-weight: 600; color: #1f2d3d; }
    .app-sub { color: #8c96a8; font-size: 12px; margin-left: 8px; }
    .file-name { font-weight: 600; color: #1f2d3d; cursor: pointer; }
  </style>
</head>
<body>
<div id="cdn-fallback">
  <h2>前端资源加载失败</h2>
  <p>本预览页需要联网从 CDN 加载 React / Ant Design / ECharts / Babel。</p>
  <p>请检查网络或代理后刷新页面；离线环境请改用 <code>cd campus-assistant/frontend &amp;&amp; npm install &amp;&amp; npm run dev</code>。</p>
  <p>本地 mock 数据与 api 封装已加载，但页面渲染依赖上述 CDN 脚本。</p>
  <p id="cdn-fallback-reason" class="reason"></p>
</div>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {
  Layout, Tabs, Card, Table, Tag, Button, Input, Statistic, Row, Col, Space,
  Typography, Descriptions, Alert, Select, Badge, Progress, Empty, Collapse, Divider,
} = antd;
const { Header, Content } = Layout;
const { Text, Paragraph } = Typography;
const API = window.CampusAPI;
const MOCK = window.MOCK_DATA;

const RESULT_COLOR = { pass: "green", fail: "red", review: "orange", skip: "default" };
const DOC_TYPE_COLOR = { "课件": "blue", "习题": "purple", "笔记": "cyan", "通知": "gold", "试卷": "volcano" };

function LabelTag({ name, label }) {
  const value = (label && label.label) || "未识别";
  const confidence = label && typeof label.confidence === "number" ? label.confidence : 0;
  return (
    <Tag color={confidence < 0.7 ? "orange" : DOC_TYPE_COLOR[value] || "geekblue"}>
      {name}：{value} {(confidence * 100).toFixed(0)}%
    </Tag>
  );
}

function DashboardPage({ onNavigate }) {
  const [health, setHealth] = React.useState(null);
  React.useEffect(function () {
    API.health().then(function (res) { setHealth(res.data); });
  }, []);

  return (
    <Space direction="vertical" size="large" style={{ width: "100%" }}>
      <Card>
        <Row gutter={16}>
          <Col span={6}><Statistic title="服务状态" value={health ? health.status : "..."} valueStyle={{ color: "#52c41a" }} /></Col>
          <Col span={6}><Statistic title="运行模式" value={health && health.mock_mode ? "MOCK" : "REAL"} /></Col>
          <Col span={6}><Statistic title="已装配 Agent" value={health ? health.agents.length : 0} /></Col>
          <Col span={6}><Statistic title="MCP 工具" value={health ? health.tools.length : 0} /></Col>
        </Row>
      </Card>
      <Alert type="info" showIcon message="当前为本地 mock 数据，不请求后端；API 调用集中在 api/client.js，切换真实接口只需改 USE_MOCK 与 BASE_URL。" />
      <Card title="七 Agent 协同">
        <Row gutter={[16, 16]}>
          {MOCK.agentsInfo.map(function (agent) {
            return (
              <Col span={8} key={agent.key}>
                <Card size="small" title={<Space><Badge status="processing" />{agent.name}</Space>}>
                  <Text type="secondary">{agent.duty}</Text>
                </Card>
              </Col>
            );
          })}
        </Row>
      </Card>
      <Card title="快速入口">
        <Space>
          <Button type="primary" onClick={function () { onNavigate("knowledge"); }}>浏览知识库</Button>
          <Button onClick={function () { onNavigate("qa"); }}>智能问答</Button>
          <Button onClick={function () { onNavigate("monitor"); }}>Agent 监控</Button>
        </Space>
      </Card>
    </Space>
  );
}

function KnowledgeBasePage({ onOpenDocument }) {
  const columns = [
    { title: "文件", dataIndex: "original_filename", render: function (v, record) {
        return <span className="file-name" onClick={function () { onOpenDocument(record); }}>{v}</span>;
      } },
    { title: "渠道", dataIndex: "channel", width: 130 },
    { title: "上传者", dataIndex: "uploader", width: 100 },
    { title: "分类结果", render: function (_, record) {
        const labels = record.labels || {};
        return (
          <Space size={[4, 4]} wrap>
            <LabelTag name="课程" label={labels.course} />
            <LabelTag name="章节" label={labels.chapter} />
            <LabelTag name="类型" label={labels.doc_type} />
            <LabelTag name="重要度" label={labels.importance} />
          </Space>
        );
      } },
    { title: "操作", width: 100, render: function (_, record) {
        return <Button size="small" onClick={function () { onOpenDocument(record); }}>详情</Button>;
      } },
  ];
  return (
    <Card title={"知识库 · 共 " + MOCK.files.length + " 份资料"} extra={<Text type="secondary">点击文件名查看详情</Text>}>
      <Table rowKey="document_id" size="small" pagination={false} dataSource={MOCK.files} columns={columns} />
    </Card>
  );
}

function DocumentDetailPage({ file, onBack }) {
  const [summary, setSummary] = React.useState(file.summary);
  React.useEffect(function () {
    API.summarize({ files: [file] }).then(function (res) { setSummary(res.data.summaries[0]); });
  }, [file.document_id]);

  const segmentColumns = [
    { title: "#", dataIndex: "seq", width: 60 },
    { title: "来源", dataIndex: "source", width: 140 },
    { title: "文本", dataIndex: "text" },
  ];
  const checks = MOCK.validation.validated.filter(function (item) { return item.target === file.document_id; });

  return (
    <Space direction="vertical" size="large" style={{ width: "100%" }}>
      <Card
        title={<Space><Button size="small" onClick={onBack}>返回</Button>{file.original_filename}</Space>}
        extra={<Tag color="blue">{file.file_type}</Tag>}
      >
        <Descriptions column={3} size="small">
          <Descriptions.Item label="来源渠道">{file.channel}</Descriptions.Item>
          <Descriptions.Item label="上传者">{file.uploader}</Descriptions.Item>
          <Descriptions.Item label="文档 ID">{file.document_id}</Descriptions.Item>
        </Descriptions>
        <Divider />
        <Space size={[4, 4]} wrap>
          <LabelTag name="课程" label={file.labels.course} />
          <LabelTag name="章节" label={file.labels.chapter} />
          <LabelTag name="类型" label={file.labels.doc_type} />
          <LabelTag name="重要度" label={file.labels.importance} />
        </Space>
      </Card>
      <Card title="解析分段">
        <Table rowKey="seq" size="small" pagination={false} dataSource={file.segments} columns={segmentColumns} />
      </Card>
      <Card title="摘要">
        <Paragraph>{summary.summary}</Paragraph>
        <Descriptions column={2} size="small" style={{ marginBottom: 8 }}>
          <Descriptions.Item label="适用场景">{summary.scenario}</Descriptions.Item>
          <Descriptions.Item label="是否截断">{summary.truncated ? "是（内容不完整）" : "否"}</Descriptions.Item>
        </Descriptions>
        <Space size={[6, 6]} wrap>{summary.knowledge_points.map(function (p) { return <Tag color="blue" key={p}>{p}</Tag>; })}</Space>
        <div style={{ marginTop: 8 }}>
          <Text type="secondary">关键词：</Text>
          {summary.keywords.map(function (k) { return <Tag key={k}>{k}</Tag>; })}
        </div>
      </Card>
      <Card title="校验记录（该文档）">
        {checks.length === 0 ? <Empty description="暂无校验记录" /> : (
          <Table rowKey={function (r) { return r.level + r.target; }} size="small" pagination={false} dataSource={checks}
            columns={[
              { title: "级别", dataIndex: "level", width: 80 },
              { title: "结果", dataIndex: "result", width: 100, render: function (v) { return <Tag color={RESULT_COLOR[v]}>{v}</Tag>; } },
              { title: "问题", dataIndex: "issue", render: function (v) { return v || "—"; } },
              { title: "置信度", dataIndex: "confidence", width: 100, render: function (v) { return (v * 100).toFixed(0) + "%"; } },
            ]} />
        )}
      </Card>
    </Space>
  );
}

function QaPage() {
  const [query, setQuery] = React.useState("概率论中贝叶斯公式怎么应用");
  const [result, setResult] = React.useState(null);
  const [loading, setLoading] = React.useState(false);

  function ask() {
    if (!query.trim()) return;
    setLoading(true);
    API.ask({ query: query, top_k: 5 }).then(function (res) { setResult(res.data); })
      .finally(function () { setLoading(false); });
  }

  return (
    <Space direction="vertical" size="large" style={{ width: "100%" }}>
      <Card title="智能问答（强制标注来源）">
        <Space.Compact style={{ width: "100%" }}>
          <Input value={query} onChange={function (e) { setQuery(e.target.value); }} onPressEnter={ask} />
          <Button type="primary" loading={loading} onClick={ask}>提问</Button>
        </Space.Compact>
      </Card>
      {result && (
        <Card title={"回答 · 置信度 " + result.confidence.toFixed(2)}>
          <Paragraph>{result.answer}</Paragraph>
          <Table rowKey="url" size="small" pagination={false} dataSource={result.sources}
            columns={[
              { title: "来源文档", dataIndex: "title" },
              { title: "链接", dataIndex: "url", render: function (v) { return <Text type="secondary">{v}</Text>; } },
              { title: "相关度", dataIndex: "score", width: 140, render: function (v) { return <Progress percent={Math.round(v * 100)} size="small" />; } },
            ]} />
        </Card>
      )}
    </Space>
  );
}

function AgentMonitorPage() {
  const [metrics, setMetrics] = React.useState(MOCK.metrics);
  const barRef = React.useRef(null);
  const pieRef = React.useRef(null);

  React.useEffect(function () {
    API.metrics().then(function (res) { setMetrics(res.data.agents); });
  }, []);

  React.useEffect(function () {
    if (!window.echarts || !barRef.current) return undefined;
    const chart = window.echarts.init(barRef.current);
    chart.setOption({
      tooltip: { trigger: "axis" },
      legend: { data: ["成功", "失败"], top: 0 },
      grid: { left: 40, right: 20, top: 40, bottom: 30 },
      xAxis: { type: "category", data: metrics.map(function (m) { return m.agent; }), axisLabel: { rotate: 20 } },
      yAxis: { type: "value" },
      series: [
        { name: "成功", type: "bar", stack: "total", itemStyle: { color: "#52c41a" }, data: metrics.map(function (m) { return m.success; }) },
        { name: "失败", type: "bar", stack: "total", itemStyle: { color: "#ff4d4f" }, data: metrics.map(function (m) { return m.fail; }) },
      ],
    });
    return function () { chart.dispose(); };
  }, [metrics]);

  React.useEffect(function () {
    if (!window.echarts || !pieRef.current) return undefined;
    const chart = window.echarts.init(pieRef.current);
    const success = metrics.reduce(function (sum, m) { return sum + m.success; }, 0);
    const fail = metrics.reduce(function (sum, m) { return sum + m.fail; }, 0);
    chart.setOption({
      tooltip: { trigger: "item" },
      legend: { bottom: 0 },
      series: [{ type: "pie", radius: ["45%", "70%"],
        data: [{ name: "成功", value: success, itemStyle: { color: "#52c41a" } }, { name: "失败", value: fail, itemStyle: { color: "#ff4d4f" } }],
        label: { formatter: "{b}: {c} ({d}%)" } }],
    });
    return function () { chart.dispose(); };
  }, [metrics]);

  return (
    <Space direction="vertical" size="large" style={{ width: "100%" }}>
      <Row gutter={16}>
        <Col span={14}><Card title="各 Agent 成功 / 失败任务数"><div ref={barRef} style={{ height: 320 }} /></Card></Col>
        <Col span={10}><Card title="任务结果占比"><div ref={pieRef} style={{ height: 320 }} /></Card></Col>
      </Row>
      <Card title="Agent 指标明细">
        <Table rowKey="agent" size="small" pagination={false} dataSource={metrics}
          columns={[
            { title: "Agent", dataIndex: "agent" },
            { title: "总任务", dataIndex: "total", width: 100 },
            { title: "成功", dataIndex: "success", width: 100 },
            { title: "失败", dataIndex: "fail", width: 100 },
            { title: "当前负载", dataIndex: "current_load", width: 110 },
            { title: "平均响应(s)", dataIndex: "avg_response_time", width: 130 },
          ]} />
      </Card>
    </Space>
  );
}

function StudyOutlinePage() {
  const [data, setData] = React.useState(null);
  const [loading, setLoading] = React.useState(false);

  function generate() {
    setLoading(true);
    API.outline({ files: MOCK.files, query: "数据结构期末复习提纲" })
      .then(function (res) { setData(res.data); })
      .finally(function () { setLoading(false); });
  }

  return (
    <Space direction="vertical" size="large" style={{ width: "100%" }}>
      <Card title="复习提纲生成" extra={<Button type="primary" loading={loading} onClick={generate}>生成提纲</Button>}>
        <Text type="secondary">基于已整理资料的摘要与知识点，按章节聚合生成分层提纲（mock）。</Text>
      </Card>
      {data && (
        <React.Fragment>
          <Card title="提纲总览">
            <Alert type="success" showIcon message={data.summary} style={{ marginBottom: 12 }} />
            <Space size={[6, 6]} wrap>{data.knowledge_points.map(function (p) { return <Tag color="blue" key={p}>{p}</Tag>; })}</Space>
          </Card>
          <Card title="分章提纲">
            <Collapse items={data.chapters.map(function (chapter, index) {
              return { key: String(index), label: chapter.chapter,
                children: (<div><Paragraph>{chapter.summary}</Paragraph><Space size={[6, 6]} wrap>{chapter.points.map(function (p) { return <Tag key={p}>{p}</Tag>; })}</Space></div>) };
            })} />
          </Card>
          <Card title="来源">
            <Table rowKey="url" size="small" pagination={false} dataSource={data.sources}
              columns={[
                { title: "资料", dataIndex: "title" },
                { title: "链接", dataIndex: "url" },
                { title: "相关度", dataIndex: "score", width: 140, render: function (v) { return <Progress percent={Math.round(v * 100)} size="small" />; } },
              ]} />
          </Card>
        </React.Fragment>
      )}
    </Space>
  );
}

function App() {
  const [activeKey, setActiveKey] = React.useState("dashboard");
  const [currentFile, setCurrentFile] = React.useState(null);

  function openDocument(file) {
    setCurrentFile(file);
    setActiveKey("detail");
  }

  return (
    <Layout style={{ minHeight: "100vh" }}>
      <Header className="app-header">
        <div>
          <span className="app-title">校园资料智能整理助手</span>
          <span className="app-sub">七 Agent 协同 · 静态 Mock 预览</span>
        </div>
        <Tag color="green">MOCK</Tag>
      </Header>
      <Content style={{ padding: 24 }}>
        <Tabs
          activeKey={activeKey}
          onChange={function (key) {
            if (key !== "detail") setCurrentFile(null);
            setActiveKey(key);
          }}
          items={[
            { key: "dashboard", label: "仪表盘", children: <DashboardPage onNavigate={setActiveKey} /> },
            { key: "knowledge", label: "知识库", children: <KnowledgeBasePage onOpenDocument={openDocument} /> },
            { key: "qa", label: "智能问答", children: <QaPage /> },
            { key: "detail", label: "资料详情", children: currentFile ? <DocumentDetailPage file={currentFile} onBack={function () { setActiveKey("knowledge"); }} /> : <Empty description="请从知识库选择一份资料" /> },
            { key: "monitor", label: "Agent 监控", children: <AgentMonitorPage /> },
            { key: "outline", label: "复习提纲", children: <StudyOutlinePage /> },
          ]}
        />
      </Content>
    </Layout>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
window.__previewReady();
</script>
</body>
</html>
